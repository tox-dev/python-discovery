name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "47 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: 🧪 Test
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      include: |
        [
          {"env": "3.15"},
          {"env": "3.15t", "python": "3.15t"},
          {"env": "3.14", "python": "3.14"},
          {"env": "3.13", "python": "3.13"},
          {"env": "3.12", "python": "3.12"},
          {"env": "3.11", "python": "3.11"},
          {"env": "3.10", "python": "3.10"},
          {"env": "3.9", "python": "3.9"},
          {"env": "type-3.9"},
          {"env": "type-3.15"},
          {"env": "dev"},
          {"env": "pkg_meta"}
        ]
  old-target:
    name: 🧪 Test on old target
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏗️ Build the wheel
        run: uv build --wheel --out-dir dist .
      - parallel:
          - name: 🧪 Discover Python 3.6
            run: tasks/old_target_check.sh 3.6 discover
          - name: 🧪 Discover Python 3.7
            run: tasks/old_target_check.sh 3.7 discover
          - name: 🧪 Reject Python 3.5
            run: tasks/old_target_check.sh 3.5 rejected
          - name: 🧪 Reject Python 2.7
            run: tasks/old_target_check.sh 2.7 rejected
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, old-target, release, hooks]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@6.8.0
        with:
          needs: ${{ toJSON(needs) }}
